[package]
name = "support-fins-solidcraft"
version = "0.7.0"
edition = "2021"
publish = false
license = "MIT"
description = "Support Fins as a SolidCraft export slot: the printfins.com engine in QuickJS, in a WebAssembly component"

[lib]
# cdylib: the WebAssembly component (wasm32-unknown-unknown, then wasm-tools component new);
# rlib: the native harness (src/bin/harness.rs) that runs the same code with a stand-in host
crate-type = ["cdylib", "rlib"]

[dependencies]
rquickjs = { version = "=0.15.0", default-features = false }
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.63"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
