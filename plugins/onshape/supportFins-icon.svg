<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- build plate -->
  <rect x="2" y="20" width="20" height="1.5" fill="#4d4d4d"/>
  <g transform="translate(3.2 0)">
    <!-- contoured fins: tops follow the overhang, a gap below it -->
    <g fill="#4d4d4d">
      <polygon points="11,20 11,18.35 12.8,16.85 12.8,20"/>
      <polygon points="13.8,20 13.8,16 15.6,14.5 15.6,20"/>
    </g>
    <!-- tipped part resting on a corner -->
    <polygon points="7.5,19.2 15.16,12.77 8.73,5.11 1.07,11.54" fill="none" stroke="#4d4d4d" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>
