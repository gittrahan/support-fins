name: Calibration result
description: What the tuning prints (docs/CALIBRATION.md) gave on your printer
title: "Calibration: <printer> + <filament>"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for printing the coupons. Each result is one more printer the defaults
        are tuned for. Rungs are counted by the raised dots (1 dot = rung 1).
        Leave out any test you didn't print.
  - type: input
    id: printer
    attributes: { label: Printer and nozzle, placeholder: "Prusa MK4, 0.4 mm" }
    validations: { required: true }
  - type: input
    id: filament
    attributes: { label: Filament (brand + type), placeholder: "Polymaker PLA Pro" }
    validations: { required: true }
  - type: input
    id: slicer
    attributes: { label: Slicer and layer height, placeholder: "OrcaSlicer 2.3, 0.2 mm" }
  - type: input
    id: angle
    attributes: { label: Angle — shallowest clean ramp, placeholder: "4 dots (25°)" }
  - type: input
    id: gap
    attributes: { label: Gap — fewest empty layers that snapped off clean, placeholder: "1 dot (1 layer, 0.2 mm)" }
  - type: input
    id: span
    attributes: { label: Span — which shelves came out flat, which sagged, placeholder: "1, 2, 4, 5 flat; 3 sagged between the walls" }
  - type: input
    id: pad
    attributes: { label: Pad — biggest gap whose cube stayed put, placeholder: "3 dots (0.12 mm)" }
  - type: textarea
    id: bore
    attributes: { label: Bore — which walls pulled out clean, which broke or stuck }
  - type: textarea
    id: notes
    attributes:
      label: Photos and notes
      description: A photo of the undersides helps most. Anything odd (welds, curls, a cube that came loose) goes here.
