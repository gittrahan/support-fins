name: docker

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'nginx.conf'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'web/**'
      - 'LICENSE'
      - '.github/scripts/test-docker.sh'
      - '.github/workflows/docker.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'nginx.conf'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'web/**'
      - 'LICENSE'
      - '.github/scripts/test-docker.sh'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: docker (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build and test the native image
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: bash .github/scripts/test-docker.sh
      - name: Save image identity and diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: docker-${{ matrix.arch }}
          path: tmp/docker-smoke.*/evidence/
          if-no-files-found: warn
          retention-days: 14
