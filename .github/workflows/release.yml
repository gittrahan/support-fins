name: release

# Releases ship from a button: Actions > release > Run workflow. main is staging;
# printfins.com deploys from the `live` branch, which only a release moves.
#
#   Run workflow (version empty for the next patch, or e.g. 1.1.0):
#       stamp web/changelog.json's `unreleased` entries under the version and rewrite the
#       What's new card + top-bar version in web/index.html, run the test suite on that
#       tree, then push it to main as one "release vX.Y.Z" commit. Fix an entry's wording
#       on main before pressing the button.
#       Then tag it, create the GitHub Release, fast-forward `live` to it (printfins.com
#       deploys), and build it through plugins.yml (plugin builds attached, versioned
#       Docker image, `latest` moved).
#   Nothing unreleased: running it again finishes a release that failed after its commit
#       (tag, live, builds); when there is nothing to finish either, the run fails. Use Run
#       workflow, not "Re-run jobs": a re-run checks out the commit before the release.
#
# The release commit is pushed with GITHUB_TOKEN, so test.yml doesn't run on it; the suite
# runs here before the push instead. main has no required checks or protection, so the push
# lands (if it ever gets protected, push with an app or personal token allowed to bypass
# it). A push that lost a race with a merge fails rather than overwriting main: run it again.
# plugins.yml is called rather than left to its own `release` trigger: a release made with
# GITHUB_TOKEN does not start other workflows. If a build fails after its release exists,
# re-run it: Actions > plugins > Run workflow, on that tag, with the tag as input.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (X.Y.Z), or empty for the next patch'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    # a run from another ref would release it
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      created: ${{ steps.create.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Stamp, test and push the release commit
        env:
          ASKED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$ASKED" ] && ! [[ "$ASKED" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "version must be X.Y.Z, got $ASKED"; exit 1; fi
          version=$(deno run -A .github/scripts/release.js --prepare ${ASKED:+"$ASKED"})
          if [ -z "$version" ]; then
            # nothing to stamp: carry on only to finish an earlier release
            if [ -n "$ASKED" ]; then echo "nothing unreleased, so version $ASKED is ignored"; fi
            newest=$(deno run -A .github/scripts/release.js --newest)
            pending=$(deno run -A .github/scripts/release.js --pending)
            live=$(git rev-parse -q --verify origin/live || true)
            sha=''
            if [ -n "$newest" ]; then sha=$(deno run -A .github/scripts/release.js --commit "$newest"); fi
            if [ "$pending" = "[]" ] && { [ -z "$newest" ] || [ "$live" = "$sha" ]; }; then
              echo "::error::nothing to release: web/changelog.json has no unreleased entries and $newest is live"; exit 1
            fi
            echo "nothing unreleased; finishing $newest"; exit 0
          fi
          deno test -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qm "release v$version" -- web/changelog.json web/index.html
          git push origin HEAD:main
          echo "released v$version as $(git rev-parse HEAD)"
      - name: Create each untagged release, oldest first
        id: create
        # `created` is written however the step ends, so the build job still builds the
        # releases made before a failure. Each release is tagged at the commit that
        # released it, not $GITHUB_SHA: when runs queue up, a later push's run can be
        # the one that finds a release untagged.
        run: |
          set -euo pipefail
          created=()
          write_created() { echo "created=$(printf '%s\n' "${created[@]}" | jq -R 'select(length>0)' | jq -sc .)" >> "$GITHUB_OUTPUT"; }
          trap write_created EXIT
          tags=$(deno run -A .github/scripts/release.js --pending)
          echo "untagged releases: $tags"
          for tag in $(echo "$tags" | jq -r '.[]'); do
            if gh release view "$tag" >/dev/null 2>&1; then echo "$tag exists, skipping"; continue; fi
            sha=$(deno run -A .github/scripts/release.js --commit "$tag")
            deno run -A .github/scripts/release.js --notes "$tag" > notes.md
            gh release create "$tag" --target "$sha" --title "$tag" --notes-file notes.md
            created+=("$tag")
          done
      - name: Move live to the newest release
        # Checked on every run, not only when a release was just made, so running it again
        # finishes a deploy that failed after its release existed. live only moves
        # forward: a non-fast-forward push fails rather than rewinding the site.
        # printfins.com deploys this branch.
        run: |
          set -euo pipefail
          tag=$(deno run -A .github/scripts/release.js --newest)
          if [ -z "$tag" ] || ! gh release view "$tag" >/dev/null 2>&1; then echo "nothing released yet"; exit 0; fi
          sha=$(deno run -A .github/scripts/release.js --commit "$tag")
          if git fetch -q origin live 2>/dev/null && [ "$(git rev-parse FETCH_HEAD)" = "$sha" ]; then echo "live is at $tag"; exit 0; fi
          git push origin "$sha:refs/heads/live"
          echo "live moved to $tag ($sha)"

  build:
    # One at a time, oldest first, so the newest release ends up as `latest`. Built from
    # this run's commit: if one run makes two releases, the older one's assets come from
    # the newer tree (rare -- each run stamps one).
    needs: [publish]
    if: always() && needs.publish.outputs.created != '' && needs.publish.outputs.created != '[]'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.publish.outputs.created) }}
    uses: ./.github/workflows/plugins.yml
    with:
      tag: ${{ matrix.tag }}
    permissions:
      contents: write
      packages: write

